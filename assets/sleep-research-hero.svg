<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sleep quality research desk</title>
  <desc id="desc">A stylized academic research desk at night with sleep data charts, a survey sheet, and study materials.</desc>
  <defs>
